name: Deploy StorageApp Backend to Lambda

on: [push, workflow_dispatch]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install production dependencies (creates node_modules)
      - name: Install dependencies
        run: npm ci --omit=dev


            # ✅ NEW — Create .env file from GitHub Secret
      - name: Create .env file
        run: |
          echo "Creating .env file..."
          echo "CLOUDFRONT_PRIVATE_KEY=${{ secrets.KEY_VALUE }}" > .env
          cat .env | sed 's/=.*/=***hidden***/'   # safe log output
          

      # 4️⃣ Create deployment zip (INCLUDING node_modules)
      - name: Create Lambda zip
        run: |
          echo "Creating Lambda package with node_modules..."
          zip -r function.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "tests/*" \
            -x "*.log"

      # 5️⃣ Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6️⃣ Deploy to Lambda
      - name: Upload to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://function.zip

      - name: Deployment success
        run: echo "Lambda deployed successfully 🚀"